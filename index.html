<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Student Records</h1>
        <p>A simple place to manage your students</p>
    </header>

    <main>
        <section class="form-section">
            <h2 id="form-title">Add a student</h2>
            <form id="student-form">
                <div class="form-group">
                    <label for="student-name">Name</label>
                    <input id="student-name" type="text" placeholder="Enter student name" required>
                </div>

                <div class="form-group">
                    <label for="student-email">Email</label>
                    <input id="student-email" type="email" placeholder="Enter student email" required>
                </div>

                <div class="form-group">
                    <label for="student-course">Course</label>
                    <input id="student-course" type="text" placeholder="Enter course name" required>
                </div>

                <div class="form-buttons">
                    <button id="submit-button" type="submit">Add student</button>
                    <button id="cancel-button" class="cancel-button" type="button" hidden>Cancel</button>
                </div>
            </form>
        </section>

        <section class="list-section">
            <div class="list-heading">
                <h2>Student list</h2>
                <p>Total students: <span id="student-count">0</span></p>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-list"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Student Records CRUD Project</p>
    </footer>
</body>
</html>
